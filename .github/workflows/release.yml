name: Release

# Push a tag like v1.2.1 to publish. Tag must match pyproject.toml and package.json.
on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/test.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py=$(grep -m1 '^version' pyproject.toml | sed -E 's/version *= *"([^"]+)"/\1/')
          js=$(node -p "require('./package.json').version")
          echo "tag=$tag pyproject=$py package.json=$js"
          [ "$tag" = "$py" ] && [ "$tag" = "$js" ] || { echo "::error::Version mismatch"; exit 1; }

      - uses: astral-sh/setup-uv@v5

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

  # npm wrapper installs the PyPI package at runtime, so publish it only after PyPI succeeds
  publish-npm:
    needs: publish-pypi
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
