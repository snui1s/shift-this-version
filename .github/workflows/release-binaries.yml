name: Build Standalone Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            binary_name: shift-this-version-windows-x64.exe
          - os: ubuntu-latest
            arch: x64
            binary_name: shift-this-version-linux-x64
          - os: macos-latest
            arch: arm64
            binary_name: shift-this-version-macos-arm64
          - os: macos-13
            arch: x64
            binary_name: shift-this-version-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies & PyInstaller
        run: |
          uv sync --all-extras
          uv pip install pyinstaller

      - name: Build Standalone Executable
        run: |
          uv run pyinstaller --onefile \
            --name ${{ matrix.binary_name }} \
            --hidden-import typer \
            --hidden-import rich \
            --hidden-import httpx \
            --hidden-import pydantic \
            --hidden-import dotenv \
            shift_this_version/cli.py

      - name: Upload Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
