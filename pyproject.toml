[project]
name = "shift-this-version"
version = "1.9.2"
description = "Smart SemVer Bumper driven by Code Diff & AI"
readme = "README.md"
authors = [
    { name = "snui1s", email = "snailsqz@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.9.4",
    "typer>=0.15.2",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
shift-this-version = "shift_this_version.cli:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Keep the source distribution small: no demo media, CI config, npm wrapper or install scripts
include = [
    "/shift_this_version",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/pytest.ini",
]

