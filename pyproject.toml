[project]
name = "shift-this-version"
version = "1.0.0"
description = "Smart SemVer Bumper driven by Code Diff"
readme = "README.md"
authors = [
    { name = "snui1s", email = "snailsqz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=13.9.4",
    "typer>=0.15.2",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[project.scripts]
shift-this-version = "shift_this_version.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

